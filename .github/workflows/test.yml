name: Tests

on:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  pull_request:
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@e3a25ae946aea8fd57da3bf2ffbf9f94ea84b8d9
    with:
      matrix-set: full
      profiles: base,jq,python
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: AGENTGUARD_SKIP_SHELLCHECK=1 test/agentguard-test

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@e3a25ae946aea8fd57da3bf2ffbf9f94ea84b8d9

  opencode:
    name: Public OpenCode adapter (${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1.18.13
            package: opencode-ai
          - version: 2.0.22
            package: '@opencode/cli'
    env:
      OPENCODE_TEST_VERSION: ${{ matrix.version }}
      OPENCODE_TEST_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Install pinned OpenCode
        shell: bash
        run: |- # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          prefix="$RUNNER_TEMP/opencode"
          npm install --prefix "$prefix" --no-save --package-lock=false \
            "$OPENCODE_TEST_PACKAGE@$OPENCODE_TEST_VERSION"
          echo "$prefix/node_modules/.bin" >>"$GITHUB_PATH"

      - name: Test OpenCode adapter
        shell: bash
        run: |-
          set -euo pipefail
          version=$(opencode --version)
          version=${version##* }
          test "${version#v}" = "$OPENCODE_TEST_VERSION"
          test/suites/opencode-agentguard-test
