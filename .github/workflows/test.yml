name: Tests

on:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  pull_request:
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@0c8c5f1c615fd61b48cc7d5de5225ca491665d80
    with:
      matrix-set: full
      profiles: base,jq,python
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: AGENTGUARD_SKIP_SHELLCHECK=1 test/agentguard-test

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@0c8c5f1c615fd61b48cc7d5de5225ca491665d80

  opencode:
    name: Public OpenCode adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENCODE_TEST_VERSION: 1.18.13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned OpenCode
        shell: bash
        run: |-
          set -euo pipefail
          prefix="$RUNNER_TEMP/opencode"
          npm install --prefix "$prefix" --no-save --package-lock=false \
            "opencode-ai@$OPENCODE_TEST_VERSION"
          echo "$prefix/node_modules/.bin" >>"$GITHUB_PATH"

      - name: Test OpenCode adapter
        shell: bash
        run: |-
          set -euo pipefail
          test "$(opencode --version)" = "$OPENCODE_TEST_VERSION"
          test/suites/opencode-agentguard-test
