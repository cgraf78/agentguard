name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@100dcd7d648099972821db4d6c80628e07f54446
    with:
      matrix-set: full
      profiles: base,shellcheck,jq,python
      test-command: test/agentguard-test
