name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@8eaac8e384ae89e9c1aaf675dd23689cfe73fa7c
    with:
      matrix-set: full
      profiles: base,jq,python
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: AGENTGUARD_SKIP_SHELLCHECK=1 test/agentguard-test
